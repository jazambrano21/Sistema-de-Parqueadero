spring:
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/parking_db}
        username: ${DB_USERNAME:postgrest}
        password: ${DB_PASSWORD:}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true

    sql:
        init:
            mode: always

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: http://localhost:8082/oauth2/jwks

    rabbitmq:
        host: host.docker.internal
        port: 5672
        username: admin
        password: admin123

server:
    port: 8082

oauth:
    server:
        url: http://localhost:8082

springdoc:
    swagger-ui:
        path: /swagger-ui.html
    api-docs:
        path: /api-docs
    show-actuator: false
    default-produces-media-type: application/json