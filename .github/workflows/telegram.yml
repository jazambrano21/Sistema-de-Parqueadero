name: CI - Tests, Sonar y Notificacion Telegram

on:
  push:
    branches: [master, dev, test]
  pull_request:
    branches: [master, test]

jobs:

  # ── Tests Java ────────────────────────────────────────────────────────────
  test-java:
    name: Tests Java - ${{ matrix.module }}
    strategy:
      matrix:
        module: [ms-usuarios-roles-oauth, ms-zonas-espacios]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Ejecutar tests
        working-directory: ParkingApp/App/${{ matrix.module }}
        run: mvn -B test

  # ── Tests NestJS ──────────────────────────────────────────────────────────
  test-nestjs:
    name: Tests NestJS - ${{ matrix.module }}
    strategy:
      matrix:
        module: [ms-tickets, ms-vehiculos]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y testear
        working-directory: ParkingApp/App/${{ matrix.module }}
        run: |
          npm install --legacy-peer-deps
          npm run test -- --passWithNoTests --forceExit

  # ── Frontend ──────────────────────────────────────────────────────────────
  test-frontend:
    name: Tests Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar si existe Frontend
        id: check
        run: |
          if [ -f "ParkingApp/Frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Instalar y testear Frontend
        if: steps.check.outputs.exists == 'true'
        working-directory: ParkingApp/Frontend
        run: |
          npm install --legacy-peer-deps
          npm run test -- --passWithNoTests --forceExit

      - name: Sin frontend
        if: steps.check.outputs.exists == 'false'
        run: echo "Frontend no implementado aún. Paso omitido."

  # ── Análisis Sonar (no bloquea el pipeline) ───────────────────────────────
  sonar-analysis:
    name: Análisis SonarCloud
    needs: [test-java, test-nestjs]
    if: always() && needs.test-java.result == 'success' && needs.test-nestjs.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Sonar - ms-usuarios-roles-oauth
        working-directory: ParkingApp/App/ms-usuarios-roles-oauth
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jazambrano21_Sistema-de-Parqueadero \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io || echo "::warning::Sonar analysis failed but not blocking"

      - name: Sonar - ms-zonas-espacios
        working-directory: ParkingApp/App/ms-zonas-espacios
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=jazambrano21_Sistema-de-Parqueadero \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io || echo "::warning::Sonar analysis failed but not blocking"

  # ── Notificación Telegram ─────────────────────────────────────────────────
  telegram-notification:
    name: Notificar en Telegram
    needs: [test-java, test-nestjs, test-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determinar resultado
        id: resultado
        run: |
          java="${{ needs.test-java.result }}"
          nestjs="${{ needs.test-nestjs.result }}"
          frontend="${{ needs.test-frontend.result }}"
          if [ "$java" == "success" ] && [ "$nestjs" == "success" ] && [ "$frontend" == "success" ]; then
            echo "estado=✅ Tests OK en ${{ github.ref_name }} | Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "estado=❌ Tests FALLARON en ${{ github.ref_name }} | Java=$java | NestJS=$nestjs | Frontend=$frontend | Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Enviar a Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="${{ steps.resultado.outputs.estado }}"
