name: CI - Tests, Sonar y Notificacion Telegram

on:
  push:
    branches: [master, dev, test]
  pull_request:
    branches: [master, test]

jobs:

  sonar-java:
    name: Test y Sonar - Microservicios Java
    strategy:
      matrix:
        module: [ms-usuarios-roles-oauth, ms-zonas-espacios]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Test y analisis Sonar
        working-directory: ParkingApp/App/${{ matrix.module }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=jazambrano21_Sistema-de-Parqueadero

  sonar-nestjs:
    name: Test y Sonar - Microservicios NestJS
    strategy:
      matrix:
        module: [ms-tickets, ms-vehiculos]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Instalar y testear
        working-directory: ParkingApp/App/${{ matrix.module }}
        run: |
          npm ci --legacy-peer-deps
          npm run test -- --passWithNoTests --forceExit

  sonar-frontend:
    name: Test y Sonar - Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar si existe Frontend
        id: check
        run: |
          if [ -f "ParkingApp/Frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Instalar y testear
        if: steps.check.outputs.exists == 'true'
        working-directory: ParkingApp/Frontend
        run: |
          npm ci --legacy-peer-deps
          npm run test -- --passWithNoTests --forceExit

      - name: Sin frontend - OK
        if: steps.check.outputs.exists == 'false'
        run: echo "No hay Frontend aún. Saltando."

  telegram-notification:
    name: Enviar mensaje a Telegram
    needs: [sonar-java, sonar-nestjs, sonar-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determinar resultado
        id: resultado
        run: |
          if [ "${{ needs.sonar-java.result }}" == "success" ] && \
             [ "${{ needs.sonar-nestjs.result }}" == "success" ] && \
             [ "${{ needs.sonar-frontend.result }}" == "success" ]; then
            echo "estado=✅ Pipeline OK en ${{ github.ref_name }} - Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "estado=❌ Pipeline FALLO en ${{ github.ref_name }} - Java=${{ needs.sonar-java.result }} NestJS=${{ needs.sonar-nestjs.result }} Frontend=${{ needs.sonar-frontend.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Enviar a Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="${{ steps.resultado.outputs.estado }}"
