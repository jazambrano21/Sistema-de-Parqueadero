<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Espacios de Estacionamiento</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css" />
</head>

<body class="bg-gray-100 p-6 font-sans antialiased">

    <!-- LOGIN -->
    <div id="loginView" class="max-w-md mx-auto mt-20 bg-white shadow rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">
            🅿️ Iniciar sesión
        </h1>

        <label class="block text-sm font-semibold text-gray-700 mb-1">Rol</label>
        <select id="rolLogin" class="w-full border rounded px-3 py-2 mb-4">
            <option value="ADMIN">ADMIN</option>
            <option value="Usuario">USUARIO</option>
            <option value="VISITANTE">VISITANTE</option>
        </select>

        <label class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
        <input id="usernameLogin" class="w-full border rounded px-3 py-2 mb-4" placeholder="Ingrese usuario" />

        <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
        <input id="passwordLogin" type="password" class="w-full border rounded px-3 py-2 mb-4" placeholder="Ingrese contraseña" />

        <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded">
            Ingresar
        </button>

        
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardView" class="max-w-7xl mx-auto hidden">

        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">🅿️ Dashboard de Espacios</h1>
                <p class="text-sm text-gray-500 mt-1">
                    Rol activo: <span id="rolActivo" class="font-semibold text-blue-700"></span>
                </p>
            </div>

            <div class="flex items-center gap-4">
                <span id="totalEspacios" class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                    Cargando...
                </span>

                <span id="statusConexion" class="flex items-center gap-2 text-sm">
                    <span class="w-3 h-3 bg-green-500 rounded-full inline-block" id="indicator"></span>
                    <span id="statusText">Conectado</span>
                </span>

                <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">
                    Salir
                </button>
            </div>
        </header>

        <div class="mb-6 bg-white p-4 rounded shadow">
            <h2 class="text-lg font-bold text-gray-800 mb-3">Datos para reservar ticket</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Placa</label>
                    <input id="placaInput" value="ABC-1234" class="w-full border rounded px-3 py-2" />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">DNI</label>
                    <input id="dniInput" value="1234567890" class="w-full border rounded px-3 py-2" />
                </div>
            </div>
        </div>

        <div id="zonasContainer">
            <!-- Las zonas y espacios se cargan desde app.js -->
        </div>

        <footer class="mt-8 text-sm text-gray-500 text-center border-t pt-4">
            Última actualización: <span id="lastUpdate">--</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
